<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Daybook — Weather, News & Timer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#12121a; --panel:#1b1b26; --panel2:#20202e; --line:#2b2b3a;
    --text:#eceef2; --muted:#8b8fa3; --amber:#ffb454; --teal:#5eead4; --red:#ff6b6b;
    box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  }
  *{box-sizing:border-box;}
  html{scroll-padding-top:env(safe-area-inset-top,0px);}
  html,body{height:100%;}
  body{
    margin:0; background:var(--bg); color:var(--text);
    font-family:'Inter',system-ui,sans-serif; -webkit-font-smoothing:antialiased;
  }
  h1,h2,.brand,.time-display{font-family:'Space Grotesk',sans-serif;}
  header{
    display:flex; align-items:center; justify-content:space-between;
    padding:20px clamp(16px,4vw,40px); border-bottom:1px solid var(--line);
    position:sticky; top:env(safe-area-inset-top,0px); background:rgba(18,18,26,.9); backdrop-filter:blur(8px); z-index:10;
  }
  .brand{font-size:20px; font-weight:700; letter-spacing:.2px;}
  .brand span{color:var(--amber);}
  nav{display:flex; gap:6px; background:var(--panel); padding:4px; border-radius:10px; border:1px solid var(--line);}
  nav button{
    background:transparent; border:none; color:var(--muted); font:inherit; font-weight:600;
    font-size:14px; padding:8px 14px; border-radius:7px; cursor:pointer; transition:.15s;
  }
  nav button.active{background:var(--panel2); color:var(--text); box-shadow:inset 0 0 0 1px var(--line);}
  main{max-width:760px; margin:0 auto; padding:clamp(20px,5vw,40px) clamp(16px,4vw,40px) 60px;}
  section{display:none;}
  section.active{display:block;}

  /* Weather */
  .search-row{display:flex; gap:8px; margin-bottom:20px;}
  input[type="text"]{
    flex:1; background:var(--panel); border:1px solid var(--line); color:var(--text);
    padding:12px 14px; border-radius:9px; font:inherit; font-size:15px;
  }
  input[type="text"]:focus{outline:2px solid var(--amber); outline-offset:1px;}
  button.go{
    background:var(--amber); border:none; color:#1a1200; font-weight:600; font-size:15px;
    padding:0 20px; border-radius:9px; cursor:pointer;
  }
  button.go:hover{filter:brightness(1.08);}
  .weather-card{
    background:linear-gradient(160deg,var(--panel),var(--panel2)); border:1px solid var(--line);
    border-radius:16px; padding:28px; text-align:center;
  }
  .w-loc{color:var(--muted); font-size:14px; margin-bottom:4px;}
  .w-temp{font-size:64px; font-weight:700; line-height:1;}
  .w-desc{color:var(--muted); margin-top:6px; font-size:15px;}
  .w-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:12px; margin-top:24px;}
  .w-stat{background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:14px 8px;}
  .w-stat b{display:block; font-size:18px; margin-top:4px;}
  .w-stat span{color:var(--muted); font-size:12px;}
  .msg{color:var(--muted); font-size:14px; text-align:center; padding:30px 0;}

  /* News */
  .news-item{
    display:block; padding:16px 0; border-bottom:1px solid var(--line);
    color:var(--text); text-decoration:none;
  }
  .news-item:last-child{border-bottom:none;}
  .news-item h3{margin:0 0 6px; font-size:16px; font-weight:600; font-family:'Inter';}
  .news-item p{margin:0; color:var(--muted); font-size:13px;}
  .news-item:hover h3{color:var(--teal);}

  /* Stopwatch */
  .sw-wrap{text-align:center; padding:20px 0;}
  .time-display{font-size:clamp(48px,12vw,84px); font-weight:700; letter-spacing:1px; font-variant-numeric:tabular-nums;}
  .time-display .ms{font-size:.45em; color:var(--muted);}
  .sw-btns{display:flex; gap:10px; justify-content:center; margin-top:26px;}
  .sw-btns button{
    font:inherit; font-weight:600; font-size:15px; padding:12px 24px; border-radius:10px; cursor:pointer; border:1px solid var(--line);
  }
  #startBtn{background:var(--teal); color:#052420; border:none;}
  #lapBtn{background:var(--panel); color:var(--text);}
  #resetBtn{background:var(--panel); color:var(--red); border-color:#3a2020;}
  .laps{margin-top:24px; text-align:left; max-height:220px; overflow-y:auto;}
  .laps div{display:flex; justify-content:space-between; padding:9px 4px; border-bottom:1px solid var(--line); font-size:14px; font-variant-numeric:tabular-nums;}
  .laps span:first-child{color:var(--muted);}
</style>
</head>
<body>

<header>
  <div class="brand">Day<span>book</span></div>
  <nav>
    <button class="tab active" data-tab="weather">Weather</button>
    <button class="tab" data-tab="news">News</button>
    <button class="tab" data-tab="stopwatch">Stopwatch</button>
  </nav>
</header>

<main>
  <section id="weather" class="active">
    <div class="search-row">
      <input type="text" id="cityInput" placeholder="Enter a city (e.g. Multan)" value="Multan">
      <button class="go" onclick="loadWeather()">Search</button>
    </div>
    <div id="weatherBox" class="msg">Loading weather…</div>
  </section>

  <section id="news">
    <div id="newsBox" class="msg">Loading headlines…</div>
  </section>

  <section id="stopwatch">
    <div class="sw-wrap">
      <div class="time-display"><span id="swMain">00:00</span><span class="ms" id="swMs">.00</span></div>
      <div class="sw-btns">
        <button id="startBtn" onclick="toggleSW()">Start</button>
        <button id="lapBtn" onclick="lapSW()">Lap</button>
        <button id="resetBtn" onclick="resetSW()">Reset</button>
      </div>
      <div class="laps" id="lapsList"></div>
    </div>
  </section>
</main>

<script>
/* ---------- Tabs ---------- */
document.querySelectorAll('.tab').forEach(btn=>{
  btn.addEventListener('click',()=>{
    document.querySelectorAll('.tab').forEach(b=>b.classList.remove('active'));
    document.querySelectorAll('section').forEach(s=>s.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById(btn.dataset.tab).classList.add('active');
  });
});

/* ---------- Weather (Open-Meteo, no API key needed) ---------- */
const wCodes = {
  0:'Clear sky',1:'Mainly clear',2:'Partly cloudy',3:'Overcast',
  45:'Fog',48:'Depositing rime fog',51:'Light drizzle',53:'Drizzle',55:'Dense drizzle',
  61:'Slight rain',63:'Rain',65:'Heavy rain',71:'Slight snow',73:'Snow',75:'Heavy snow',
  80:'Rain showers',81:'Rain showers',82:'Violent rain showers',
  95:'Thunderstorm',96:'Thunderstorm w/ hail',99:'Thunderstorm w/ hail'
};
async function loadWeather(){
  const city = document.getElementById('cityInput').value.trim() || 'Multan';
  const box = document.getElementById('weatherBox');
  box.className='msg'; box.textContent='Loading weather…';
  try{
    const geoRes = await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(city)}&count=1`);
    const geo = await geoRes.json();
    if(!geo.results || !geo.results.length){ box.textContent='City not found. Try another name.'; return; }
    const {latitude,longitude,name,country} = geo.results[0];
    const wRes = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${latitude}&longitude=${longitude}&current=temperature_2m,relative_humidity_2m,weather_code,wind_speed_10m&timezone=auto`);
    const w = await wRes.json();
    const c = w.current;
    box.className='';
    box.innerHTML = `
      <div class="weather-card">
        <div class="w-loc">${name}, ${country}</div>
        <div class="w-temp">${Math.round(c.temperature_2m)}°C</div>
        <div class="w-desc">${wCodes[c.weather_code] || 'Weather updated'}</div>
        <div class="w-grid">
          <div class="w-stat"><span>Humidity</span><b>${c.relative_humidity_2m}%</b></div>
          <div class="w-stat"><span>Wind</span><b>${Math.round(c.wind_speed_10m)} km/h</b></div>
          <div class="w-stat"><span>Local time</span><b>${new Date(w.current.time).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'})}</b></div>
        </div>
      </div>`;
  }catch(e){
    box.textContent = 'Could not load weather right now. Check your connection.';
  }
}
loadWeather();

/* ---------- News (free, no-key public headlines mirror) ---------- */
async function loadNews(){
  const box = document.getElementById('newsBox');
  try{
    const res = await fetch('https://saurav.tech/NewsAPI/top-headlines/category/general/in.json');
    const data = await res.json();
    const items = (data.articles || []).slice(0,12);
    if(!items.length){ box.textContent='No headlines available right now.'; return; }
    box.innerHTML = items.map(a=>`
      <a class="news-item" href="${a.url}" target="_blank" rel="noopener">
        <h3>${(a.title||'').replace(/</g,'&lt;')}</h3>
        <p>${a.source?.name || ''}${a.publishedAt ? ' · '+new Date(a.publishedAt).toLocaleDateString() : ''}</p>
      </a>`).join('');
  }catch(e){
    box.textContent = 'Could not load news right now. Check your connection.';
  }
}
loadNews();

/* ---------- Stopwatch ---------- */
let swRunning=false, swStart=0, swElapsed=0, swTimer=null, lapCount=0;
function fmt(ms){
  const totalMs = Math.floor(ms);
  const m = String(Math.floor(totalMs/60000)).padStart(2,'0');
  const s = String(Math.floor((totalMs%60000)/1000)).padStart(2,'0');
  const cs = String(Math.floor((totalMs%1000)/10)).padStart(2,'0');
  return {main:`${m}:${s}`, ms:'.'+cs};
}
function tick(){
  const t = fmt(swElapsed + (performance.now()-swStart));
  document.getElementById('swMain').textContent = t.main;
  document.getElementById('swMs').textContent = t.ms;
  swTimer = requestAnimationFrame(tick);
}
function toggleSW(){
  const btn = document.getElementById('startBtn');
  if(!swRunning){
    swRunning=true; swStart=performance.now(); btn.textContent='Pause'; btn.style.background='var(--amber)';
    tick();
  } else {
    swRunning=false; swElapsed += performance.now()-swStart; cancelAnimationFrame(swTimer);
    btn.textContent='Start'; btn.style.background='var(--teal)';
  }
}
function lapSW(){
  if(!swRunning) return;
  lapCount++;
  const t = fmt(swElapsed + (performance.now()-swStart));
  const row = document.createElement('div');
  row.innerHTML = `<span>Lap ${lapCount}</span><span>${t.main}${t.ms}</span>`;
  document.getElementById('lapsList').prepend(row);
}
function resetSW(){
  swRunning=false; swElapsed=0; lapCount=0; cancelAnimationFrame(swTimer);
  document.getElementById('swMain').textContent='00:00';
  document.getElementById('swMs').textContent='.00';
  document.getElementById('lapsList').innerHTML='';
  const btn = document.getElementById('startBtn');
  btn.textContent='Start'; btn.style.background='var(--teal)';
}
</script>
</body>
</html>
